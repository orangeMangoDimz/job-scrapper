services:

  # Delete this to activate the cron schedule job.
  # Also mounts full config (base removed it; dev needs it, prod uses image-baked config).
  bot:
    entrypoint: ["sleep"]
    command: ["infinity"]
    volumes:
      - ./config.yaml:/workspace/config.yaml:ro

  # override: mount merged dev config
  scraper-mcp:
    volumes:
      - /tmp/config.dev.yaml:/app/config.yaml

  # override: run as the host user so config.yaml stays writable; local access only
  scraper-ui:
    user: "${UI_UID:-1001}:${UI_GID:-1001}"
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      - UI_ENV=dev
      - UI_MCP_URL=http://scraper-mcp:8080/mcp
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./config.dev.patch.yaml:/app/config.dev.patch.yaml:ro
      - /tmp/config.dev.yaml:/app/config.dev.yaml
      - ./config-backups:/app/config-backups
