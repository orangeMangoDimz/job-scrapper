repos:
  #  file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe] # docker-compose.prod.yml uses the compose !reset tag
      - id: check-toml
      - id: check-json
        exclude: ^ui/tsconfig\..*\.json$ # TypeScript config allows comments
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: debug-statements
      - id: check-docstring-first

  #  format + lint (ruff replaces black + flake8 + isort)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  #  typecheck
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.1
    hooks:
      - id: mypy
        additional_dependencies:
          - types-pyyaml
          - types-dateparser

  #  secret scan
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        exclude: >-
          (?x)^(
            .env.example|
            docs/.*|
            tests/.*fixtures.*
          )$
