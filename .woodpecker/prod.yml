when:
  - event: [push, manual]
    branch: [main]

steps:
  - name: publish mcp
    image: woodpeckerci/plugin-docker-buildx
    privileged: true
    when:
      - branch: main
    settings:
      registry: ghcr.io
      repo: ghcr.io/pt-sinan-akbar/job-scraper-mcp/prod
      dockerfile: Dockerfile
      target: mcp-server
      platforms: linux/amd64
      tags:
        - "${CI_COMMIT_SHA:0:7}"
        - "${CI_PIPELINE_CREATED}-${CI_COMMIT_SHA:0:7}"
      cache_images:
        - ghcr.io/pt-sinan-akbar/job-scraper-mcp/prod:cache
      username:
        from_secret: ghcr_username
      password:
        from_secret: ghcr_token

  - name: publish bot
    image: woodpeckerci/plugin-docker-buildx
    privileged: true
    when:
      - branch: main
    settings:
      registry: ghcr.io
      repo: ghcr.io/pt-sinan-akbar/job-scraper-bot/prod
      dockerfile: Dockerfile
      target: bot
      platforms: linux/amd64
      tags:
        - "${CI_COMMIT_SHA:0:7}"
        - "${CI_PIPELINE_CREATED}-${CI_COMMIT_SHA:0:7}"
      cache_images:
        - ghcr.io/pt-sinan-akbar/job-scraper-bot/prod:cache
      username:
        from_secret: ghcr_username
      password:
        from_secret: ghcr_token

  - name: publish ui
    image: woodpeckerci/plugin-docker-buildx
    privileged: true
    when:
      - branch: main
    settings:
      registry: ghcr.io
      repo: ghcr.io/pt-sinan-akbar/job-scraper-ui/prod
      dockerfile: Dockerfile
      target: ui-server
      platforms: linux/amd64
      tags:
        - "${CI_COMMIT_SHA:0:7}"
        - "${CI_PIPELINE_CREATED}-${CI_COMMIT_SHA:0:7}"
      cache_images:
        - ghcr.io/pt-sinan-akbar/job-scraper-ui/prod:cache
      username:
        from_secret: ghcr_username
      password:
        from_secret: ghcr_token

  - name: discord success notification
    when:
      status: [ success ]
    image: appleboy/drone-discord
    settings:
      webhook_id:
        from_secret: discord_webhook_id
      webhook_token:
        from_secret: discord_webhook_token
      message: >
        {{repo.name}} [{{commit.branch}}] build #{{build.number}} ({{truncate commit.sha 7}}) | status: success. {{build.link}}

  - name: discord failure notification
    when:
      status: [ failure ]
    image: appleboy/drone-discord
    settings:
      webhook_id:
        from_secret: discord_webhook_id
      webhook_token:
        from_secret: discord_webhook_token
      message: >
        {{repo.name}} [{{commit.branch}}] build #{{build.number}} ({{truncate commit.sha 7}}) | status: failed. {{build.link}}
