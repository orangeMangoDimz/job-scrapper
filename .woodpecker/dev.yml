when:
  - event: [push, manual]
    branch: [dev]

steps:
  - name: publish mcp
    image: woodpeckerci/plugin-docker-buildx
    privileged: true
    when:
      - branch: dev
    settings:
      registry: ghcr.io
      repo: ghcr.io/pt-sinan-akbar/job-scraper-mcp/dev
      dockerfile: Dockerfile
      target: mcp-server
      platforms: linux/amd64
      tags:
        - "${CI_COMMIT_SHA:0:7}"
        - "${CI_PIPELINE_CREATED}-${CI_COMMIT_SHA:0:7}"
      cache_images:
        - ghcr.io/pt-sinan-akbar/job-scraper-mcp/dev:cache
      username:
        from_secret: ghcr_username
      password:
        from_secret: ghcr_token

  - name: publish bot
    image: woodpeckerci/plugin-docker-buildx
    privileged: true
    when:
      - branch: dev
    settings:
      registry: ghcr.io
      repo: ghcr.io/pt-sinan-akbar/job-scraper-bot/dev
      dockerfile: Dockerfile
      target: bot
      platforms: linux/amd64
      tags:
        - "${CI_COMMIT_SHA:0:7}"
        - "${CI_PIPELINE_CREATED}-${CI_COMMIT_SHA:0:7}"
      cache_images:
        - ghcr.io/pt-sinan-akbar/job-scraper-bot/dev:cache
      username:
        from_secret: ghcr_username
      password:
        from_secret: ghcr_token

  - name: publish ui
    image: woodpeckerci/plugin-docker-buildx
    privileged: true
    when:
      - branch: dev
    settings:
      registry: ghcr.io
      repo: ghcr.io/pt-sinan-akbar/job-scraper-ui/dev
      dockerfile: Dockerfile
      target: ui-server
      platforms: linux/amd64
      tags:
        - "${CI_COMMIT_SHA:0:7}"
        - "${CI_PIPELINE_CREATED}-${CI_COMMIT_SHA:0:7}"
      cache_images:
        - ghcr.io/pt-sinan-akbar/job-scraper-ui/dev:cache
      username:
        from_secret: ghcr_username
      password:
        from_secret: ghcr_token
