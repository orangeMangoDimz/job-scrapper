keywords:
  - full stack engineer
  - software engineer
  - ai engineer
  - mobile engineer
  - backend engineer
  # - project manager
  # - product owner
  # - quality assurance
  # - data analyst
  # - content writer
  # - seo

limit: 3
concurrency: 2
output_dir: output

# Dedup pagination: gather candidate jobs, keep only those not seen in previous
# runs, until `limit` NEW jobs are collected per (site, keyword). The page budget
# differs by fetch strategy:
#   max_pages     — HTML-scraped sites (LinkedIn): one real, rate-limited HTTP
#                   fetch per page, so keep modest. page_delay_sec spaces them out.
#   api_max_pages — API-backed sites (JobStreet, Glints, Indeed): a single pooled
#                   request (pageSize = limit * budget, capped 100), so a deeper
#                   new-jobs search is cheap — set this higher.
# A per-site `max_pages` under `sites:` overrides both.
max_pages: 3
api_max_pages: 10
page_delay_sec: 1.5

# socks5://host:port or http://host:port — commented out for direct connection
# (deployed on a homeserver with a residential IP; no proxy/tunnel needed)
# proxy: "socks5://localhost:1080"

bot:
  # Informational only — the k8s CronJob (k8s/cronjob.yaml) is the source of truth
  # for the schedule. MAX_CHARS is now an env var and the Discord message template
  # lives in docs/response_template.md.
  schedule: "0 11 * * *"

# jobs older than this are dropped; pair with URL param windows per site
max_age_hours: 72

filter:
  location: [jakarta, tangerang, tangerang selatan, bandung, bekasi, Indonesia]
  # employment_type: [full-time, internship, contract, part-time]
  # work_type: [remote, hybrid, onsite]

# Raw job descriptions run to ~2.5k chars each (9k observed) and are ~80% of the
# payload handed to the bot, which only renders a few bullets. Cap them server-side.
requirements_max_chars: 600

# anchors (site, matched_keyword, title, company, url) always included
default_fields:
  - title
  - company
  - location
  - url
  - salary
  - posted_date
  - posted_at
  - work_type
  - employment_type
  - requirements

sites:
  jobstreet:
    enabled: true
    limit: 3
    url_template: "https://id.jobstreet.com/id/{keyword_slug}-jobs?daterange=1&sortmode=ListedDate"

  glints:
    enabled: true
    limit: 3
    url_template: "https://glints.com/id/opportunities/jobs/explore?keyword={keyword}&country=ID&sortBy=LATEST"
    fields:
      - title
      - company
      - location
      - url
      - salary
      - posted_date
      - posted_at
      - work_type
      - employment_type
      - experience_level
      - requirements

  linkedin:
    enabled: true
    limit: 3
    # guest API ignores sortBy=DD (verified); f_TPR is the real recency lever. Kept for convention.
    url_template: "https://www.linkedin.com/jobs-guest/jobs/api/seeMoreJobPostings/search?keywords={keyword}&location=Indonesia&f_TPR=r86400&sortBy=DD&start=0"
    fields:
      - title
      - company
      - location
      - url
      - posted_date
      - posted_at
      - requirements

  indeed:
    enabled: true
    limit: 3
    url_template: "https://id.indeed.com/jobs?q={keyword_plus}&l=Indonesia&fromage=1"
