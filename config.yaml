keywords:
  # - full stack engineer
  - software engineer
  - ai engineer
  - mobile engineer
  - back end engineer
  # - project manager
  # - product owner
  # - quality assurance
  # - data analyst
  # - content writer
  # - seo

limit: 3
concurrency: 2

# socks5://host:port or http://host:port — comment out for direct connection
proxy: "socks5://localhost:1080"

bot:
  schedule: "0 11 * * *"
  model: claude-haiku-4-5-20251001
  max_chars: 1900
  message_template: |
    ## {title}
    {company} | {location}

    **Details**
    Link: [link]({url})
    Source: {site}
    Diposting: {posted_date}

  # Use this inside "message_template" to display the requirements
  # **Requirements**:
  # {requirements}

# jobs older than this are dropped; pair with URL param windows per site
max_age_hours: 72

# network tuning (seconds unless suffixed _ms); all optional — omitted keys use defaults
timeouts:
  http_seconds: 30
  playwright_goto_ms: 60000
  playwright_networkidle_ms: 15000
  playwright_settle_seconds: 2
  indeed_api_seconds: 30

filter:
  location: [jakarta, tangerang, tangerang selatan, bandung, bekasi, Indonesia]
  # employment_type: [full-time, internship, contract, part-time]
  # work_type: [remote, hybrid, onsite]

# anchors (site, matched_keyword, title, company, url) always included
default_fields:
  - title
  - company
  - location
  - url
  - salary
  - posted_date
  - posted_at
  - requirements

sites:
  jobstreet:
    enabled: true
    limit: 3
    url_template: "https://id.jobstreet.com/id/{keyword_slug}-jobs?daterange=1&sortmode=ListedDate"

  glints:
    enabled: true
    limit: 3
    url_template: "https://glints.com/id/opportunities/jobs/explore?keyword={keyword}&country=ID&sortBy=LATEST"
    fields:
      - title
      - company
      - location
      - url
      - salary
      - posted_date
      - posted_at
      - work_type
      - experience_level
      - requirements

  linkedin:
    enabled: true
    limit: 3
    # guest API ignores sortBy=DD (verified); f_TPR is the real recency lever. Kept for convention.
    url_template: "https://www.linkedin.com/jobs-guest/jobs/api/seeMoreJobPostings/search?keywords={keyword}&location=Indonesia&f_TPR=r86400&sortBy=DD&start=0"
    fields:
      - title
      - company
      - location
      - url
      - posted_date
      - posted_at
      - requirements

  indeed:
    enabled: true
    limit: 3
    url_template: "https://id.indeed.com/jobs?q={keyword_plus}&l=Indonesia&fromage=1"
