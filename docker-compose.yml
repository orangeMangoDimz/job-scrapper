services:
  # SERVICE: scraper — one-shot CLI scraper; network_mode:host for SOCKS5 proxy passthrough
  # Disabled, this is just to test if the scraper works independently
  # scraper:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #     target: scraper-cli
  #   image: job-scraper:latest
  #   container_name: job-scraper
  #   restart: "no"
  #   profiles: ["scraper"]
  #   network_mode: host
  #   depends_on:
  #     output-init:
  #       condition: service_completed_successfully
  #   volumes:
  #     - ./config.yaml:/app/config.yaml:ro
  #     - ./output:/app/output
  #   environment:
  #     - PROXY_URL=${PROXY_URL:-}

  # SERVICE: mongo — persistent MongoDB store for scrape run history
  mongo:
    image: mongo:7
    container_name: job-scraper-mongo
    restart: unless-stopped
    stop_grace_period: 30s
    profiles: ["mcp", "mongo"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # SERVICE: scraper-mcp — long-running MCP HTTP server; profile-gated so `docker compose up` skips it by default
  scraper-mcp:
    build:
      context: .
      dockerfile: Dockerfile
      target: mcp-server
    image: job-scraper-mcp:latest
    container_name: job-scraper-mcp
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    profiles: ["mcp"]
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    ports:
      - "8080:8080"
    volumes:
      - ./docs:/app/docs:ro
    environment:
      - MONGO_URI=mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD}@mongo:27017
      - MONGO_DB_NAME=${MONGO_DB_NAME:-job_scraper}
      - MONGO_COLLECTION_NAME=${MONGO_COLLECTION_NAME:-scrape_runs}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-plain}
      - LOG_FILE=${LOG_FILE:-}
      - SENTRY_ENABLED=${SENTRY_ENABLED:-false}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-production}
      - SENTRY_TRACES_SAMPLE_RATE=${SENTRY_TRACES_SAMPLE_RATE:-0.0}
      - SENTRY_RELEASE=${SENTRY_RELEASE:-}

  # SERVICE: bot — cron bot; runs claude-code on a schedule; profile-gated so `docker compose up` skips it by default
  bot:
    build:
      context: .
      dockerfile: Dockerfile
      target: bot
    image: job-scraper-bot:latest
    container_name: job-scraper-bot
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    profiles: ["bot"]
    extra_hosts:
      - "host.docker.internal:host-gateway" # allows bot to reach scraper-mcp via host.docker.internal:8080 (Linux only)
    environment:
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - DISCORD_CHANNEL_ID=${DISCORD_CHANNEL_ID}
      - TZ=${TZ:-Asia/Jakarta}
      - BOT_SCHEDULE=${BOT_SCHEDULE:-}
      - CLAUDE_MODEL=${CLAUDE_MODEL:-}
      - BOT_LOG_FILE=${BOT_LOG_FILE:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-plain}
    volumes:
      - ${CLAUDE_CONFIG_DIR:-~/.claude}:/home/node/.claude
      - ${CLAUDE_CONFIG_FILE:-~/.claude.json}:/home/node/.claude.json

volumes:
  mongo-data:
